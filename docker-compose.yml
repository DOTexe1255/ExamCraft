version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    command: ["node", "index.js"]

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    # volumes:
    #   - ./frontend:/app
    command: ["npm", "run", "dev"]

  