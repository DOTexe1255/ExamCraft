
services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: ["node", "index.js"]
    # for local development, you can uncomment the following lines to use a local MySQL database instead of the Aiven cloud database. Make sure to set the correct environment variables in the .env file.
    # depends_on:
    #   database:
    #     condition: service_healthy
    # environment:
    #   MYSQL_HOST: database
    #   MYSQL_USER: root
    #   MYSQL_PASSWORD: password
    #   MYSQL_DATABASE: examcraft
    #   MYSQL_PORT: 3306
    env_file:
      - ./backend/.env
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - backend
    stdin_open: true
    tty: true

  database:
    build:
      context: ./database
    container_name: examcraft-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: examcraft
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/Examcraft_db_proto.sql:/docker-entrypoint-initdb.d/Examcraft_db_proto.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data: